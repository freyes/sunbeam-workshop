#
# Docs quality gate (drafts D-17, IS-11; plan todo 19): the sphinx-stack
# check battery over docs/. Local twin: `just docs-check` runs the same
# stack Makefile targets in the same order. Every step below calls the
# stack's own Makefile target - no custom commands. pa11y (WCAG 2.2 AA) is
# local-only by stack design and deliberately NOT run here (docs/README.rst).
# The battery also renders and validates the reno release notes, so the
# trigger paths cover the note fragments and the reno config too.
name: docs

on:
  push:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yaml'
      - 'reno.yaml'
      - 'releasenotes/**'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yaml'
      - 'reno.yaml'
      - 'releasenotes/**'

permissions:
  contents: read

jobs:
  docs-checks:
    name: docs-checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the sphinx-stack build embeds per-file
          # last-updated dates from git; a shallow clone warns per file
          # and the strict (-W) build fails.
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Bootstrap the docs venv (stack Makefile)
        run: make -C docs install
      - name: Build docs (strict, warnings are errors)
        run: make -C docs html SPHINXOPTS="-W"
      - name: Spelling check
        run: make -C docs spelling
      - name: Link check
        run: make -C docs linkcheck
      - name: Inclusive language check
        run: make -C docs woke
      - name: Style guide lint
        run: make -C docs vale
