[project]
name = "sunbeam-workshop"
version = "0.1.0"
description = "Config layer merge and workshop vars-builder tooling for the sunbeam-workshop repo."
requires-python = ">=3.12"
dependencies = [
    "jinja2-cli==1.0.1",
    "check-jsonschema==0.39.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sunbeam_workshop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
