---
fixes:
  - |
    ``just setup <name>`` no longer aborts in its secrets step when the
    instance was launched from an older definition without the
    ``openrouter-key`` plug: ``workshop connect`` resolves plugs against
    the definition the instance was launched from, not the current render,
    so an instance predating the openrouter lane refuses the connect with
    "SDK has no plug named openrouter-key" and the whole guided setup
    stopped in step 5/6. The optional OpenRouter lane in
    ``scripts/secret-setup.sh`` now degrades instead: a refused connect
    warns with the recovery (``workshop refresh <name>``, or
    ``just remove <name>`` + ``just setup <name>``, then
    ``just secret-setup <name>``) and continues, and a failed post-Ready
    auth converger warns and continues. The mandatory GitHub lane (token
    keyring store, gh login, ``gh-cli:github-token`` connect) is unchanged
    and still fails hard on error. New suite coverage in
    ``scripts/tests/secret-setup.sh`` models both degrade paths, and the
    how-to gained a Troubleshooting entry for the stale-definition case.